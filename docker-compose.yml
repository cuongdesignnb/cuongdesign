services:
  postgres:
    image: postgres:15-alpine
    container_name: cuongdesign-db
    restart: always
    environment:
      POSTGRES_USER: cuongdesign_user
      POSTGRES_PASSWORD: cuongdesign_password
      POSTGRES_DB: cuongdesign_db
    ports:
      - "5439:5432"
    volumes:
      - postgres_design_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cuongdesignnet-web
    container_name: cuongdesign-web
    restart: always
    ports:
      - "13000:3000"
    command: sh -c "npx prisma migrate deploy && node server.js"
    environment:
      - DATABASE_URL=postgresql://cuongdesign_user:cuongdesign_password@postgres:5432/cuongdesign_db?schema=public
      - NEXTAUTH_SECRET=your_nextauth_secret_here
      - AUTH_SECRET=your_nextauth_secret_here
      - NEXTAUTH_URL=http://localhost:13000
      - AUTH_URL=http://localhost:13000
      - AUTH_TRUST_HOST=true
      - AI_QUEUE_EMBEDDED_WORKER=false
      # Thêm các biến môi trường khác vào đây (Zalo, Telegram, Mailer...)
    depends_on:
      - postgres
    volumes:
      - media_uploads:/app/public/uploads

  ai-worker:
    image: cuongdesignnet-web
    container_name: cuongdesign-ai-worker
    restart: always
    command: npm run ai:worker
    environment:
      - DATABASE_URL=postgresql://cuongdesign_user:cuongdesign_password@postgres:5432/cuongdesign_db?schema=public
      - AI_QUEUE_EMBEDDED_WORKER=false
    depends_on:
      - postgres
    volumes:
      - media_uploads:/app/public/uploads

volumes:
  postgres_design_data:
  media_uploads:
